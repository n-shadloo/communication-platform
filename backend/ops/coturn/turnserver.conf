# coturn — self-hosted TURN relay for voice media; no foreign STUN/TURN is ever used.
# Deployed to /etc/chat/turnserver.conf. Clients run a relay-only ICE policy, so media
# flows client → this relay → the LiveKit SFU on this same VPS; this box is TURN-only
# and answers no discovery STUN.
#
# Secrets/realm live in the operator's env file (.env.example: TURN_REALM /
# TURN_STATIC_AUTH_SECRET), never in git. coturn cannot read env vars from a config
# file, and CLI flags would expose the secret in world-readable /proc/*/cmdline — so
# at deploy time copy this file to /etc/chat/turnserver.conf, owned root:turnserver
# mode 0640 (the same trust boundary as .env.production), and fill realm= and
# static-auth-secret= inline from those env values.

# Listen only on the VPS's own public interface — never a wildcard.
listening-ip=YOUR_VPS_IP
relay-ip=YOUR_VPS_IP
listening-port=3478
tls-listening-port=5349
# TLS uses the wildcard Let's Encrypt certificate for the domain.
cert=/etc/letsencrypt/live/nimashadloo.dev/fullchain.pem
pkey=/etc/letsencrypt/live/nimashadloo.dev/privkey.pem

# Ephemeral HMAC credentials derived from the shared static secret (use-auth-secret):
# no per-user account state is ever stored here.
use-auth-secret
# Filled at deploy time from the env file (see header); placeholders only in git:
#realm=chat.nimashadloo.dev
#static-auth-secret=FILL_FROM_ENV_FILE

# Relay port range. Distinct from LiveKit's own media range (50100–50200) so firewall
# rules stay legible; open both.
min-port=50300
max-port=50400

# TURN-only, minimal surface:
no-stun                    # no discovery STUN — relay-only clients never need it
no-cli                     # no telnet admin surface
no-rfc5780                 # no NAT-behavior discovery
no-stun-backward-compatibility
fingerprint
no-multicast-peers
no-software-attribute      # do not advertise a version banner
# TCP relay stays available for UDP-hostile client networks (no `no-tcp-relay`).

# Logs: operational errors only; never peer addresses at verbose levels.
no-stdout-log
syslog
simple-log
