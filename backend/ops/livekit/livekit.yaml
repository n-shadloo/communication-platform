# LiveKit SFU — self-hosted on the owner's VPS. Deployed to /etc/chat/livekit.yaml by
# the operator; run by ops/systemd/livekit.service.
#
# This process carries media only. It never sees an SFrame/media key: join tokens are
# minted by Django (voicerooms/livekit.py) with LIVEKIT_API_KEY/SECRET, which are
# infrastructure secrets, and SFrame keys are derived client-side from the live MLS
# subgroup.
#
# No key material lives in this file: livekit.service composes the LIVEKIT_KEYS
# environment variable ("<api-key>: <api-secret>") from /srv/chat/backend/.env.production.

# Signal/API WebSocket: loopback only. nginx terminates TLS and reverse-proxies
# wss://<host>/rtc here, next to /api and /ws.
bind_addresses:
  - 127.0.0.1
port: 7880

# Requires livekit-server >= v1.4: the audio-only token scoping relies on the
# canPublishSources grant, which an older binary would silently ignore.
rtc:
  # Media ports on the VPS. Open exactly this UDP range (plus the TCP fallback) in the
  # firewall; clients that cannot reach them relay through the coturn below.
  port_range_start: 50100
  port_range_end: 50200
  tcp_port: 7881
  # Never ask anyone else's STUN for our own address (no foreign STUN/TURN); the
  # operator's node_ip / firewall setup announces the VPS address.
  use_external_ip: false

# Relay is the self-hosted coturn (ops/coturn/turnserver.conf) in a relay-only posture;
# LiveKit's embedded TURN stays off so there is exactly one audited relay path.
turn:
  enabled: false

room:
  # Authorization is the Django-minted token (roomJoin + room=<uuid>). Live room state
  # exists only while occupied and is dropped when empty; the persistent artifact is
  # solely the voicerooms_room row (id + encrypted name).
  auto_create: true

logging:
  # Identities are device UUIDs; keep them out of routine logs.
  level: warn
