server {
    listen 80;
    listen [::]:80;
    server_name chat.nimashadloo.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat.nimashadloo.dev;

    # Wildcard Let's Encrypt certificate; the shared snippet owns the certificate
    # paths and TLS protocol settings.
    include snippets/letsencrypt-ssl.conf;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    client_max_body_size 70m;               # largest attachment bucket is 64 MiB, plus multipart overhead

    # This host serves an API and a WebSocket, nothing else. The admin lives under
    # the operator-chosen ADMIN_PATH, so nothing is hardcoded here.
    location = / { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-headers.conf;
        # Django runs with USE_X_FORWARDED_HOST; pin the header so a client-supplied
        # value can never reach it.
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # LiveKit signal WebSocket: the SFU binds loopback:7880 and serves its signal
    # path at /rtc; LIVEKIT_URL=wss://chat.nimashadloo.dev (the client SDK appends
    # /rtc). Media itself rides the RTC/TURN ports, never nginx.
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        include snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /static/ {
        alias /srv/chat/backend/static_root/;
    }

    # Attachment bytes: Django authorizes, nginx serves from an internal location.
    location /_protected_attachments/ {
        internal;
        alias /srv/chat/backend/media_root/;
    }
}
