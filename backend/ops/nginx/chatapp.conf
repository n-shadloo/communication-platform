server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;               # filled by operator
    ssl_certificate     /etc/chatapp/tls/server.crt;
    ssl_certificate_key /etc/chatapp/tls/server.key;
    ssl_protocols TLSv1.3;                  # TLS 1.3 only (rec-15)
    ssl_early_data off;                     # disable 0-RTT
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    client_max_body_size 70m;               # ATTACH_MAX_BYTES + headroom

    location /api/ { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location /ws   { proxy_pass http://127.0.0.1:8000;
                     proxy_http_version 1.1;
                     proxy_set_header Upgrade $http_upgrade;
                     proxy_set_header Connection "upgrade";
                     proxy_read_timeout 3600s; }
    # LiveKit signal WebSocket (ARCHITECTURE §A9): the SFU binds loopback:7880 and
    # serves its signal path at /rtc; LIVEKIT_URL=wss://YOUR_DOMAIN (the client SDK
    # appends /rtc). Media itself rides the RTC/TURN ports, never nginx.
    location /rtc  { proxy_pass http://127.0.0.1:7880;
                     proxy_http_version 1.1;
                     proxy_set_header Upgrade $http_upgrade;
                     proxy_set_header Connection "upgrade";
                     proxy_read_timeout 3600s; }
    location /static/ { alias /etc/chatapp/static_root/; }
    # Attachment bytes: Django authorizes, nginx serves from an internal location.
    location /_protected_attachments/ {
        internal;
        alias /etc/chatapp/media_root/;
    }
}
