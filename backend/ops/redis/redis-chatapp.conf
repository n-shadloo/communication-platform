# Redis for the chat backend: loopback only and deliberately non-persistent, so
# volatile relay state (channel layer, presence, throttle counters) never touches
# disk.
bind 127.0.0.1
protected-mode yes
save ""
appendonly no

# On the shared VPS, loopback is reachable by every local service, and an
# unauthenticated Redis would let any compromised neighbour flush the cache or
# inject frames into the channel layer. At deploy time, uncomment and fill from
# the same generator as the other secrets, then carry the password in REDIS_URL
# (redis://:<password>@127.0.0.1:6379/0) in .env.production. Left commented for
# single-user development machines.
#requirepass FILL_AT_DEPLOY
