# Frozen Private Experimental Beta release identity.
#
# Every value here is PUBLIC. This file holds no key material and no password.
# It is the single source of truth that `app/build.gradle.kts` builds against
# and that `tool/verify_release_apk.sh` verifies produced artifacts against, so
# the built identity and the verified identity can never drift apart.
#
# WARNING - these two values are frozen at the first external Beta install.
#
# Android accepts an update only when the application ID and the signing
# certificate both match the installed app. Changing either one turns every
# later release into a different application: the OS refuses the update, and the
# only way forward is uninstall plus reinstall.
#
# For this app that is unrecoverable. Uninstalling erases all app data, which
# here means both the SQLCipher database and the no_backup/storage_key_v1.bin
# envelope holding its key, and the manifest sets allowBackup="false" so nothing
# restores either. The database key exists nowhere else: it is protected by a
# non-exportable AndroidKeyStore key, so there is no exportable copy to keep.
# Local message history has no server-side copy by design.
#
# Do not edit either value. See docs/release-signing.md.

# Frozen Beta application ID. Production is a separate, coexisting application
# ID and is deliberately not derived from this value.
application.id=dev.nimashadloo.chat.beta

# SHA-256 digest of the Beta signing certificate, lower-case hex, no colons, as
# reported by `apksigner verify --print-certs`.
#
# Empty means no Beta signing identity has been created yet. Populate it once,
# from `tool/create_beta_keystore.sh`, and never change it again. Verification
# fails closed while it is empty: an artifact cannot be released until the
# identity it must match is recorded here.
signing.certificate.sha256=d8d40c0c30f34dcb243e4d0020c86bca90b480234f0fb46b83722caf71b5a2ff
