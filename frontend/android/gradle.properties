org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ADR-059. `emoji_picker_flutter` and the `shared_preferences_android` it pulls in are the
# first plugin subprojects here that compile Kotlin, and every release build of them failed
# with "Could not close incremental caches ... class-fq-name-to-source.tab,
# source-to-classes.tab, internal-name-to-source.tab" - five attempts, five failures,
# surviving a daemon stop and a delete of both build directories, and passing only with
# -Pkotlin.incremental=false. The Kotlin Build Tools API cannot release its memory-mapped
# cache files here. This project owns five Kotlin files and the two plugins own a handful
# between them, so a non-incremental Kotlin compile costs seconds and buys a build that
# completes. Revisit if the plugins migrate to Flutter's built-in Kotlin (ADR-059 F2).
kotlin.incremental=false
