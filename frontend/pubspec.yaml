name: communication_platform
description: "Android and Web client foundation for Communication Platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.2 <3.13.0'
  flutter: 3.44.7

dependencies:
  dio: ^5.11.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  forui: ^0.24.3
  go_router: ^17.3.0
  intl: 0.20.2
  riverpod_annotation: 4.0.3
  sqlite3: 3.5.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # 4.0.6 is not solver-compatible with its analyzer utility as published.
  riverpod_generator: 4.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Variable.ttf
